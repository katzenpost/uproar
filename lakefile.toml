name = "uproar"
version = "0.1.0"
description = "Noise and PQ Noise written in Lean"
keywords = ["noise", "post-quantum", "cryptography", "protocol"]
license = "AGPL-3.0-only"
defaultTargets = ["Uproar"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "cryptlib"
git = "https://github.com/katzenpost/cryptlib.git"
rev = "6f651738d26db5ac18dd5670bf501cfc63723175"

[[lean_lib]]
name = "Uproar"

[[lean_exe]]
name = "Uproar.vectors_test"

[[lean_exe]]
name = "Uproar.pq_test"

[[lean_exe]]
name = "Uproar.example"
